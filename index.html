<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Get Paid Today</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
.box{
  max-width:400px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}
button{
  width:100%;
  padding:14px;
  background:#00b050;
  color:white;
  border:none;
  font-size:18px;
  border-radius:6px;
  cursor:pointer;
}
button:hover{
  background:#009940;
  transform:scale(1.05);
  transition:0.2s;
}
img:hover{
  transform:scale(1.02);
  transition:0.3s;
}
.popup{
  position:fixed;
  bottom:20px;
  left:10px;
  background:white;
  padding:10px;
  border-radius:6px;
  box-shadow:0 0 5px;
  animation:fadeInOut 4s infinite;
}
@keyframes fadeInOut {
  0%,100% {opacity:0;}
  50% {opacity:1;}
}
.sticky{position:fixed;bottom:0;width:100%;background:#00b050;color:white;padding:12px;text-align:center;cursor:pointer}

/* Progress bar */
#progressContainer{
  width:100%;
  background:#ccc;
  border-radius:10px;
  height:12px;
  margin:10px 0;
}
#progressBar{
  width:0%;
  height:100%;
  background:#00b050;
  border-radius:10px;
  transition:width 0.3s;
}
#progressText{
  font-weight:bold;
  margin-bottom:5px;
}
</style>
</head>

<body>

<div class="box">
<h2>Get Paid For Your Opinions 💰</h2>
<p>US Residents Can Earn $25+ Today</p>
<img src="survey-method.webp" style="width:100%;border-radius:10px">

<audio id="clicksound" preload="auto">
<source src="https://www.soundjay.com/buttons/sounds/button-16.mp3" type="audio/mpeg">
</audio>

<br><br>

<button onclick="startSurvey()">📝 Enter Now & Claim $25+</button>

<!-- Fake survey / progress bar -->
<div id="progressText" style="display:none;">3 questions left...</div>
<div id="progressContainer" style="display:none;">
  <div id="progressBar"></div>
</div>

<p style="color:#d00000;font-weight:bold;">Only 5 Slots Left – Claim Yours!</p>
</div>

<div class="sticky" onclick="next()">Continue ➜</div>

<div class="popup" id="pop"></div>

<script>
// ===== PUT LINKS =====
var android="https://singingfiles.com/show.php?l=0&u=2407998&id=73805";
var ios="https://singingfiles.com/show.php?l=0&u=2407998&id=73210";
var desktop="https://singingfiles.com/show.php?l=0&u=2407998&id=73209";

// Country Lock USA
fetch("https://ipapi.co/json/")
.then(r=>r.json())
.then(d=>{
if(d.country!="US"){document.body.innerHTML="<h2>Offer Available Only In USA</h2>";}
});

// Fake signup popup
var names=["Mike","Sarah","John","Emma","David"];
setInterval(()=>{
document.getElementById("pop").innerHTML=names[Math.floor(Math.random()*5)]+" just signed up!";
},4000);

// ===== Survey / Progress Bar Logic =====
function startSurvey(){
  var a = document.getElementById("clicksound");
  a.play().catch(()=>{});
  
  // Show fake survey bar
  document.getElementById("progressText").style.display="block";
  document.getElementById("progressContainer").style.display="block";
  
  let step=0;
  let textArr=["3 questions left...","2 questions left...","1 question left..."];
  let bar=document.getElementById("progressBar");
  let txt=document.getElementById("progressText");
  
  let interval=setInterval(()=>{
    step++;
    bar.style.width=(step*33)+"%";
    txt.innerText=textArr[Math.min(step-1,2)];
    if(step>=3){clearInterval(interval); next();}
  },500); // 0.5s per step
}

function next(){
  window.location="spinner.html";
}

// Save links
localStorage.setItem("android",android);
localStorage.setItem("ios",ios);
localStorage.setItem("desktop",desktop);
</script>

</body>
</html>
