<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Get Paid Today</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
.box{max-width:400px;margin:30px auto;background:white;padding:20px;border-radius:10px;text-align:center}
button{width:100%;padding:14px;background:#00b050;color:white;border:none;font-size:18px;border-radius:6px}
.popup{position:fixed;bottom:20px;left:10px;background:white;padding:10px;border-radius:6px;box-shadow:0 0 5px}
.sticky{position:fixed;bottom:0;width:100%;background:#00b050;color:white;padding:12px;text-align:center}
</style>
</head>

<body>

<div class="box">
<h2>Get Paid For Your Opinions 💰</h2>
<p>US Residents Can Earn $25+ Today</p>
<img src="https://i.imgur.com/jW9Z7kQ.png" style="width:100%;border-radius:10px">

<audio id="clicksound">
<source src="https://www.soundjay.com/buttons/sounds/button-3.mp3" type="audio/mpeg">
</audio>

<br><br>

<button onclick="play()">📝 ENTER SURVEY</button>

<script>
function play(){
document.getElementById("clicksound").play();
setTimeout(next,400);
}
</script>
<p>Only 5 Slots Left</p>
</div>

<div class="sticky" onclick="next()">Continue ➜</div>

<div class="popup" id="pop"></div>

<script>
// ===== PUT LINKS =====
var android="https://singingfiles.com/show.php?l=0&u=2407998&id=73805";
var ios="https://singingfiles.com/show.php?l=0&u=2407998&id=73210";
var desktop="https://singingfiles.com/show.php?l=0&u=2407998&id=73209";

// Country Lock USA
fetch("https://ipapi.co/json/")
.then(r=>r.json())
.then(d=>{
if(d.country!="US"){document.body.innerHTML="<h2>Offer Available Only In USA</h2>";}
});

// Fake signup popup
var names=["Mike","Sarah","John","Emma","David"];
setInterval(()=>{
document.getElementById("pop").innerHTML=names[Math.floor(Math.random()*5)]+" just signed up!";
},4000);

function next(){
window.location="spinner.html";
}

// Save links
localStorage.setItem("android",android);
localStorage.setItem("ios",ios);
localStorage.setItem("desktop",desktop);
</script>

</body>
</html>
